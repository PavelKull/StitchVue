[package]
name = "stitchvue"
version = "0.1.6"
description = "Fast photo gallery for large folders"
authors = ["StitchVue"]
license = "MIT"
edition = "2021"

[lib]
name = "stitchvue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
heic-rs = "0.1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "tga", "hdr", "pnm", "qoi"] }
moxcms = "0.8"
notify = "8.2.0"
rayon = "1"
rawler = "0.8.0"
zenavif = "0.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12"
jpeg-decoder = { version = "0.3.2", default-features = false }
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Decoders run on untrusted files; a panic in one must stay a per-file error.
panic = "unwind"
strip = true

# Release code generation without LTO, for `cargo test --profile perf` benchmarks.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Debug builds of the JPEG decoder take about 10 s per 18 MP photo.
# Keep the app debuggable and compile the decoder optimized.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.test.package.jpeg-decoder]
opt-level = 3

[profile.test.package.image]
opt-level = 3

[profile.test.package.zune-jpeg]
opt-level = 3

[profile.test.package.zune-core]
opt-level = 3

[profile.dev.package.heic-rs]
opt-level = 3

[profile.dev.package.rust_h265]
opt-level = 3

[profile.test.package.heic-rs]
opt-level = 3

[profile.test.package.rust_h265]
opt-level = 3

[profile.dev.package.rawler]
opt-level = 3

[profile.test.package.rawler]
opt-level = 3

[profile.dev.package.zenavif]
opt-level = 3

[profile.test.package.zenavif]
opt-level = 3
